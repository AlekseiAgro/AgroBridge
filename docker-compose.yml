services:
  postgres:
    image: postgres:16-alpine
    container_name: agrobridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrobridge
      POSTGRES_PASSWORD: agrobridge
      POSTGRES_DB: agrobridge
    ports:
      - "5432:5432"
    volumes:
      - agrobridge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrobridge -d agrobridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agrobridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - agrobridge_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agrobridge_pg_data:
  agrobridge_redis_data:
